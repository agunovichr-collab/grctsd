<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль Товаров - Скачать</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .version {
            color: #666;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #2ea44f;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2c974b;
        }
        .info {
            margin-top: 16px;
            font-size: 14px;
            color: #888;
        }
        .loading {
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Контроль Товаров</h1>
        <div class="version" id="version">Загрузка...</div>
        <a href="#" class="btn" id="downloadBtn">Скачать APK</a>
        <div class="info">Автоматическая установка на устройство</div>
    </div>

    <script>
        fetch('https://raw.githubusercontent.com/agunovichr-collab/grctsd/main/version.json?t=' + Date.now())
            .then(r => r.json())
            .then(data => {
                document.getElementById('version').textContent = 'Текущая версия: ' + data.latestVersionName;
                document.getElementById('downloadBtn').href = data.apkUrl;
            })
            .catch(() => {
                document.getElementById('version').textContent = 'Ошибка загрузки';
            });
    </script>
</body>
</html>
