<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль Товаров - Скачать</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .version {
            color: #666;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #2ea44f;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2c974b;
        }
        .qr-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #eee;
        }
        .qr-section p {
            color: #888;
            font-size: 14px;
            margin-bottom: 16px;
        }
        #qrcode {
            display: inline-block;
            padding: 12px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Контроль Товаров</h1>
        <div class="version" id="version">Загрузка...</div>
        <a href="#" class="btn" id="downloadBtn">Скачать APK</a>
        
        <div class="qr-section">
            <p>Отсканируйте QR-код для перехода на эту страницу</p>
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        // Генерируем QR-код с текущим URL страницы
        var pageUrl = window.location.href;
        new QRCode(document.getElementById("qrcode"), {
            text: pageUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Загружаем информацию о версии
        fetch('https://raw.githubusercontent.com/agunovichr-collab/grctsd/main/version.json?t=' + Date.now())
            .then(r => r.json())
            .then(data => {
                document.getElementById('version').textContent = 'Текущая версия: ' + data.latestVersionName;
                document.getElementById('downloadBtn').href = data.apkUrl;
            })
            .catch(() => {
                document.getElementById('version').textContent = 'Ошибка загрузки';
            });
    </script>
</body>
</html>
